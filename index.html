<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080503" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="唐人街" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>唐人街 - 手机原型 P0</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="https://cdn.jsdelivr.net/gh/YepQQQ/chinatown@main/assets/chinatown-logo.png" />
    <link rel="stylesheet" href="styles.css?v=shop-scroll-1" />
  </head>
  <body>
    <main class="entry-shell screen is-active" id="homeScreen">
      <section class="home-art" aria-label="唐人街首页">
        <span id="lanUrlText" hidden>正在获取局域网地址...</span>
        <label class="home-name-field" aria-label="你的昵称">
          <input id="nicknameInput" maxlength="8" value="你" />
        </label>
        <button class="home-hotspot name-dice-hotspot" id="randomNameButton" type="button" aria-label="随机昵称"></button>
        <button class="home-hotspot rules-hotspot" id="gameRulesButton" type="button" aria-label="游戏规则"></button>
        <button class="home-hotspot join-hotspot" id="openJoinRoomButton" type="button" aria-label="加入房间"></button>
        <button class="home-hotspot create-hotspot" id="createRoomButton" type="button" aria-label="创建房间"></button>
        <p class="form-error home-error" id="homeError" aria-live="polite"></p>
      </section>
    </main>

    <main class="entry-shell screen" id="waitingScreen">
      <section class="room-waiting-art" aria-label="房间等待室">
        <strong id="waitingRoomSize" hidden>等待室</strong>
        <h1 class="room-code-value" id="waitingRoomCode">----</h1>
        <div class="waiting-list room-player-stage" id="waitingPlayers" aria-label="已加入玩家"></div>
        <p class="waiting-status" id="waitingStatus">等待朋友加入。</p>
        <button class="room-hotspot room-back-hotspot" id="backHomeButton" type="button" aria-label="返回首页">返回首页</button>
        <button class="room-hotspot room-start-hotspot" id="startGameButton" type="button" aria-label="开始游戏">开始游戏</button>
      </section>
    </main>

    <main class="entry-shell screen" id="moneyScreen">
      <section class="money-art" id="moneyArt" aria-label="初始资金发放">
        <div class="money-list" id="moneyList"></div>
      </section>
    </main>

    <main class="entry-shell screen" id="buildingDealScreen">
      <section class="lot-deal-art" id="lotDealArt" aria-label="地块发放">
        <div class="lot-deal-list" id="lotDealList"></div>
      </section>
    </main>

    <main class="app-shell screen" id="gameScreen">
      <header class="top-bar">
        <div>
          <span class="label">轮次</span>
          <strong>1 / 6</strong>
        </div>
        <div class="phase-pill">自由交易</div>
        <div class="cash">
          <span class="label">现金</span>
          <strong>50 万</strong>
        </div>
      </header>

      <section class="players" aria-label="玩家列表">
        <div class="player-count" aria-label="本局人数">
          <span class="label">人数</span>
          <strong id="playerCountLabel">3人局</strong>
          <small>开局后锁定</small>
        </div>
        <div class="player-list" id="playersList"></div>
      </section>

      <section class="board-panel">
        <div class="board-toolbar">
          <div class="turn-strip">
            <span>当前轮数：<b id="roundLabel">1/6轮</b></span>
            <span>我的金钱：<b id="cashLabel">5万元</b></span>
          </div>
          <div class="selected-summary" id="selectedSummary">未选择地块</div>
          <div class="side-actions">
            <button id="playersButton" type="button">玩家</button>
            <button id="hintButton" type="button">信息</button>
          </div>
        </div>
        <div class="board-wrap" id="boardWrap">
          <div class="board" id="board" aria-label="85 个地块地图"></div>
          <div class="map-measure" id="mapMeasure" aria-hidden="true"></div>
        </div>
      </section>

      <aside class="side-panel" aria-label="游戏操作">
        <section class="bottom-drawer">
          <nav class="tabs" aria-label="操作标签">
            <button class="tab is-active" data-tab="cards" type="button">地块</button>
            <button class="tab" data-tab="shops" type="button">商铺</button>
          </nav>

          <div class="tab-panel is-active" id="cards">
            <div class="card-row" id="cardRow"></div>
            <div class="draft-action" id="draftAction"></div>
          </div>

          <div class="tab-panel" id="shops">
            <div class="shop-grid" id="shopGrid"></div>
            <div class="shop-action-row" id="shopActionRow"></div>
          </div>
        </section>

        <button class="floating-trade" id="startTradeButton" type="button">发起交易</button>
      </aside>
    </main>

    <div class="modal-backdrop" id="playersModal" aria-hidden="true">
      <section class="hint-modal players-modal" role="dialog" aria-modal="true" aria-labelledby="playersTitle">
        <div class="hint-head">
          <div>
            <span class="label">玩家信息</span>
            <h2 id="playersTitle">本局玩家</h2>
          </div>
          <button id="closePlayers" type="button">关闭</button>
        </div>
        <div class="player-modal-list" id="playerModalList"></div>
      </section>
    </div>

    <div class="modal-backdrop" id="hintModal" aria-hidden="true">
      <section class="hint-modal" role="dialog" aria-modal="true" aria-labelledby="hintTitle">
        <div class="hint-head">
          <div>
            <span class="label">游戏信息</span>
            <h2 id="hintTitle">信息</h2>
          </div>
          <button id="closeHint" type="button">关闭</button>
        </div>
        <div class="hint-content" id="hintContent">提示内容待补充。你后面提供具体文案后，我会放到这里。</div>
      </section>
    </div>

    <div class="modal-backdrop" id="joinModal" aria-hidden="true">
      <section class="hint-modal join-modal" role="dialog" aria-modal="true" aria-labelledby="joinTitle">
        <div class="hint-head">
          <div>
            <span class="label">加入已有房间</span>
            <h2 id="joinTitle">输入房间号</h2>
          </div>
          <button id="closeJoin" type="button">关闭</button>
        </div>
        <label class="join-code-field">
          <span>房间号</span>
          <input id="roomCodeInput" maxlength="6" placeholder="例如 A1B2" />
        </label>
        <p class="form-error join-error" id="joinError" aria-live="polite"></p>
        <p class="hint-note">房间号由房主在等待室页面查看并告诉你。</p>
        <div class="modal-actions">
          <button class="modal-secondary" data-join-close type="button">取消</button>
          <button class="modal-primary" id="joinRoomButton" type="button">加入房间</button>
        </div>
      </section>
    </div>

    <div class="modal-backdrop trade-backdrop" id="tradeModal" aria-hidden="true">
      <section class="hint-modal trade-modal" role="dialog" aria-modal="true" aria-labelledby="tradeTitle">
        <div class="hint-head">
          <div>
            <span class="label">自由交易</span>
            <h2 id="tradeTitle">发起交易</h2>
          </div>
          <button id="closeTrade" type="button">关闭</button>
        </div>
        <div class="trade-body" id="tradeBody"></div>
        <button class="confirm-draft trade-submit" id="submitTrade" type="button">发送交易提议</button>
      </section>
    </div>

    <aside class="test-tools" id="testTools" hidden>
      <button class="test-toggle" id="testToggle" type="button">测试</button>
      <section class="test-panel" id="testPanel" aria-hidden="true">
        <div class="test-head">
          <strong>测试辅助</strong>
          <small>仅 ?test=1</small>
        </div>
        <div class="test-grid">
          <button data-test-action="fillBots" type="button">补满玩家</button>
          <button data-test-action="startGame" type="button">开始游戏</button>
          <button data-test-action="toShopDraft" type="button">发店铺</button>
          <button data-test-action="placeChain" type="button">茶馆连锁</button>
          <button data-test-action="settleIncome" type="button">结算本轮</button>
          <button data-test-action="nextRound" type="button">下一轮</button>
          <button data-test-action="jumpToRound" data-round="5" type="button">到第5轮</button>
          <button data-test-action="finishGame" type="button">最终结算</button>
          <button data-test-action="audit" type="button">规则自检</button>
          <button data-test-action="fullAudit" type="button">全流程自检</button>
        </div>
        <p id="testStatus">创建房间后可用。</p>
      </section>
    </aside>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js?v=shop-scroll-1"></script>
  </body>
</html>
